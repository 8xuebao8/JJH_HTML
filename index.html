  if(!edit)return;
  editContext.putImageData(edit.showOriginal?edit.original:resultPixels(),0,0);
  if(edit.crop&&!edit.showOriginal){const r=cropRect();editContext.fillStyle='rgb(35 38 30 / .35)';editContext.beginPath();editContext.rect(0,0,edit.width,edit.height);editContext.rect(r.x,r.y,r.width,r.height);editContext.fill('evenodd');editContext.strokeStyle='#596350';editContext.lineWidth=2*edit.width/(editCanvas.getBoundingClientRect().width||edit.width);editContext.strokeRect(r.x,r.y,r.width,r.height);}
  $('crop-apply').disabled=!edit.crop||edit.showOriginal;
  const color=edit.sample?.color,hex=color?'#'+color.map(value=>value.toString(16).padStart(2,'0')).join(''):null;
  $('sample-swatch').style.backgroundColor=hex||'transparent';$('sample-value').textContent=hex||TEXT.colorEmpty;$('remove-color').disabled=!edit.sample||edit.showOriginal;
  document.querySelectorAll('[data-transform]').forEach(button=>button.disabled=edit.showOriginal);
  $('undo').disabled=!edit.history.length||edit.showOriginal;
  $('auto-cut').disabled=edit.showOriginal;$('restore-image').disabled=edit.showOriginal;
  $('original-view').textContent=edit.showOriginal?TEXT.showResult:TEXT.showOriginal;
  $('original-view').setAttribute('aria-pressed',edit.showOriginal);
  document.querySelectorAll('[data-tool]').forEach(button=>{const active=button.dataset.tool===edit.tool;button.classList.toggle('active',active);button.setAttribute('aria-pressed',active);});
}
async function openEditor(automatic){
  const design=state.image;if(!design)return;
  try{
    const image=new Image();image.src=design.url;await image.decode();
    if(state.image!==design)return;
    editCanvas.width=image.naturalWidth;editCanvas.height=image.naturalHeight;editContext.clearRect(0,0,editCanvas.width,editCanvas.height);editContext.drawImage(image,0,0);
    const pixels=editContext.getImageData(0,0,editCanvas.width,editCanvas.height);
    edit={original:design.originalPixels||pixels,alpha:alphaOf(pixels),width:editCanvas.width,height:editCanvas.height,anchor:{...(design.anchor||{x:.5,y:0})},tip:{...(design.tip||{x:.5,y:1})},history:[],tool:'wand',showOriginal:false,stroke:null,crop:null,sample:null};
    $('color-all').checked=false;
    edit.root=design.editRoot||{original:edit.original,width:edit.width,height:edit.height,anchor:{...edit.anchor},tip:{...edit.tip}};
    $('editor').showModal();editorStatus(TEXT.editorReady);paintEditor();if(automatic)removeBackground();
  }catch{status(TEXT.editorFailed,true);}
}
// 从边缘泛洪仅删除连通的浅色区域；封闭镂空需要用户点击，避免盲目删除白色珠宝。
function removeBackground(seed,sampled=false){
  if(!edit||edit.showOriginal)return;
  const {width:w,height:h,original,alpha}=edit,n=w*h,tolerance=Number($('tolerance').value);
  if(sampled&&!edit.sample)return;
  // RGB 各通道与取色值的最大偏差不超过容差；参照固定取色值，避免颜色逐步漂移。
  const qualifies=index=>{const i=index*4,r=original.data[i],g=original.data[i+1],b=original.data[i+2];if(sampled){const color=edit.sample.color;return original.data[i+3]===0||Math.max(Math.abs(r-color[0]),Math.abs(g-color[1]),Math.abs(b-color[2]))<=tolerance;}return original.data[i+3]===0||(Math.min(r,g,b)>=255-tolerance&&Math.max(r,g,b)-Math.min(r,g,b)<=tolerance);};
  if(seed!==undefined&&!qualifies(seed)){editorStatus(TEXT.pickWhite);return;}
  const visited=new Uint8Array(n),queue=new Int32Array(n);let head=0,tail=0,changed=0;
  function add(index){if(!visited[index]){visited[index]=1;if(qualifies(index))queue[tail++]=index;}}
  if(sampled&&$('color-all').checked){for(let index=0;index<n;index++)add(index);}else if(seed!==undefined)add(seed);else{for(let x=0;x<w;x++){add(x);add((h-1)*w+x);}for(let y=0;y<h;y++){add(y*w);add(y*w+w-1);}}
  const next=alpha.slice();
  while(head<tail){const index=queue[head++],x=index%w;if(next[index]){next[index]=0;changed++;}if(x>0)add(index-1);if(x<w-1)add(index+1);if(index>=w)add(index-w);if(index<n-w)add(index+w);}
  if(!changed){editorStatus(sampled?TEXT.colorNone:TEXT.noBackground);return;}
  if(!next.some(value=>value>0)){editorStatus(TEXT.emptyCutout);return;}
  remember();edit.alpha=next;paintEditor();editorStatus(sampled?TEXT.colorDone:TEXT.autoDone);
}
function canvasPoint(event){const bounds=editCanvas.getBoundingClientRect(),inset=edit.tool==='crop'?0:1;return{x:Math.min(edit.width-inset,Math.max(0,(event.clientX-bounds.left)*edit.width/bounds.width)),y:Math.min(edit.height-inset,Math.max(0,(event.clientY-bounds.top)*edit.height/bounds.height))};}
function stamp(point){
  const radius=Number($('brush').value)*edit.width/editCanvas.getBoundingClientRect().width/2;
  for(let y=Math.max(0,Math.floor(point.y-radius));y<=Math.min(edit.height-1,Math.ceil(point.y+radius));y++)for(let x=Math.max(0,Math.floor(point.x-radius));x<=Math.min(edit.width-1,Math.ceil(point.x+radius));x++){
    const coverage=Math.min(1,Math.max(0,radius-Math.hypot(x-point.x,y-point.y)));
    if(!coverage)continue;
    const index=y*edit.width+x,target=edit.tool==='restore'?edit.original.data[index*4+3]:0;
    edit.alpha[index]=Math.round(edit.alpha[index]*(1-coverage)+target*coverage);
  }
}
editCanvas.addEventListener('pointerdown',event=>{
  if(!edit||edit.showOriginal||edit.stroke||event.button!==0)return;
  event.preventDefault();const point=canvasPoint(event);
  if(edit.tool==='sample'){const index=Math.floor(point.y)*edit.width+Math.floor(point.x);if(!edit.alpha[index]){editorStatus(TEXT.colorTransparent);return;}edit.sample={index,color:Array.from(edit.original.data.subarray(index*4,index*4+3))};paintEditor();editorStatus(TEXT.colorPicked);return;}
  if(edit.tool==='wand'){removeBackground(Math.floor(point.y)*edit.width+Math.floor(point.x));return;}
  if(edit.tool==='crop'){edit.crop={start:point,end:point};edit.stroke={point,id:event.pointerId};editCanvas.setPointerCapture(event.pointerId);paintEditor();return;}
  remember();edit.stroke={point,id:event.pointerId};editCanvas.setPointerCapture(event.pointerId);stamp(point);paintEditor();
});
editCanvas.addEventListener('pointermove',event=>{
  if(!edit?.stroke||event.pointerId!==edit.stroke.id)return;
  if(edit.tool==='crop'){edit.crop.end=canvasPoint(event);paintEditor();return;}
  const point=canvasPoint(event),last=edit.stroke.point,distance=Math.hypot(point.x-last.x,point.y-last.y);
  const step=Math.max(1,Number($('brush').value)*edit.width/editCanvas.getBoundingClientRect().width/6),steps=Math.ceil(distance/step);
  for(let i=1;i<=steps;i++)stamp({x:last.x+(point.x-last.x)*i/steps,y:last.y+(point.y-last.y)*i/steps});
  edit.stroke.point=point;paintEditor();
});
function finishStroke(){if(!edit?.stroke)return;edit.stroke=null;if(!edit.alpha.some(value=>value>0)){restoreSnapshot(edit.history.pop());editorStatus(TEXT.emptyCutout);}paintEditor();}
editCanvas.addEventListener('pointerup',finishStroke);editCanvas.addEventListener('pointercancel',finishStroke);editCanvas.addEventListener('lostpointercapture',finishStroke);
document.querySelectorAll('[data-tool]').forEach(button=>button.onclick=()=>{edit.tool=button.dataset.tool;edit.crop=null;edit.showOriginal=false;paintEditor();editorStatus(edit.tool==='crop'?TEXT.cropHint:edit.tool==='sample'?TEXT.colorHint:TEXT.editorReady);});
$('cutout').onclick=()=>openEditor(true);$('repair').onclick=()=>openEditor(false);
$('auto-cut').onclick=()=>removeBackground();
$('remove-color').onclick=()=>{if(edit.sample)removeBackground(edit.sample.index,true);};
$('undo').onclick=()=>{if(edit.history.length){restoreSnapshot(edit.history.pop());paintEditor();editorStatus(TEXT.editorReady);}};
$('restore-image').onclick=()=>{remember();restoreSnapshot({...edit.root,anchor:{...edit.root.anchor},tip:{...edit.root.tip},alpha:alphaOf(edit.root.original)});paintEditor();editorStatus(TEXT.editorReady);};
$('original-view').onclick=()=>{edit.showOriginal=!edit.showOriginal;paintEditor();editorStatus(edit.showOriginal?TEXT.originalView:TEXT.editorReady);};
function updateEditorSettings(){$('tolerance-value').textContent=$('tolerance').value;$('brush-value').textContent=`${$('brush').value} ${TEXT.brushUnit}`;}
$('tolerance').oninput=updateEditorSettings;$('brush').oninput=updateEditorSettings;updateEditorSettings();
function exportCanvas(){const canvas=document.createElement('canvas');canvas.width=edit.width;canvas.height=edit.height;canvas.getContext('2d').putImageData(resultPixels(),0,0);return canvas;}
$('apply-edit').onclick=()=>{if(!edit.alpha.some(value=>value>0)){editorStatus(TEXT.emptyCutout);return;}const url=exportCanvas().toDataURL('image/png');state.image={...state.image,url,ratio:edit.width/edit.height,anchor:{...edit.anchor},tip:{...edit.tip},opaque:false,originalPixels:edit.original,editRoot:edit.root};$('thumb').src=url;render();$('editor').close();status(TEXT.cutoutDone);};
$('download').onclick=()=>{const link=document.createElement('a');link.href=exportCanvas().toDataURL('image/png');link.download=TEXT.downloadName;link.click();};
$('cancel-edit').onclick=()=>$('editor').close();
$('editor').addEventListener('close',()=>{edit=null;editCanvas.width=1;editCanvas.height=1;});
function cropRect(){const {start,end}=edit.crop,x=Math.floor(Math.min(start.x,end.x)),y=Math.floor(Math.min(start.y,end.y));return{x,y,width:Math.min(edit.width-x,Math.ceil(Math.max(start.x,end.x))-x),height:Math.min(edit.height-y,Math.ceil(Math.max(start.y,end.y))-y)};}
// 对原始像素和 alpha 同步做整数坐标变换，旋转/镜像不插值，不混入背景色。
function transformPixels(kind,rect){
  const w=edit.width,h=edit.height,swap=kind==='left'||kind==='right',nw=rect?rect.width:swap?h:w,nh=rect?rect.height:swap?w:h;
  const original=new ImageData(nw,nh),alpha=new Uint8ClampedArray(nw*nh);
  for(let y=0;y<nh;y++)for(let x=0;x<nw;x++){
    let sx=x,sy=y;
    if(rect){sx=x+rect.x;sy=y+rect.y;}else if(kind==='right'){sx=y;sy=h-1-x;}else if(kind==='left'){sx=w-1-y;sy=x;}else if(kind==='mirrorX')sx=w-1-x;else if(kind==='mirrorY')sy=h-1-y;
    const from=sy*w+sx,to=y*nw+x;original.data.set(edit.original.data.subarray(from*4,from*4+4),to*4);alpha[to]=edit.alpha[from];
  }
  if(!alpha.some(value=>value>0)){editorStatus(TEXT.emptyCutout);return;}
  function mapPoint(point){if(rect)return{x:(point.x*w-rect.x)/nw,y:(point.y*h-rect.y)/nh};if(kind==='right')return{x:1-point.y,y:point.x};if(kind==='left')return{x:point.y,y:1-point.x};if(kind==='mirrorX')return{x:1-point.x,y:point.y};return{x:point.x,y:1-point.y};}
  let anchor=mapPoint(edit.anchor),tip=mapPoint(edit.tip);
  const outside=point=>point.x<0||point.x>1||point.y<0||point.y>1;
  const invalid=outside(anchor)||outside(tip)||tip.y-anchor.y<.05-1e-9;
  if(invalid){anchor={x:.5,y:0};tip={x:.5,y:1};}
  remember();restoreSnapshot({original,alpha,width:nw,height:nh,anchor,tip});paintEditor();editorStatus(invalid?TEXT.anchorReset:TEXT.geometryDone);
}
$('crop-apply').onclick=()=>{const rect=cropRect();if(rect.width<4||rect.height<4){editorStatus(TEXT.cropSmall);return;}transformPixels('crop',rect);};
document.querySelectorAll('[data-transform]').forEach(button=>button.onclick=()=>transformPixels(button.dataset.transform));
buildStage();
</script>
